name: Deploy HonKit v7 to page branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-honkit
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install exact dependencies
        run: npm ci

      - name: Build HonKit static site
        run: |
          npm run build
          touch _book/.nojekyll

      - name: Publish static output to orphan page branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _book
          publish_branch: page
          force_orphan: true
          commit_message: "deploy(page): build from ${{ github.sha }}"
